<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WWF Family</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--fg:#fff;--dim:#b5b5b5;--line:rgba(255,255,255,.22);--glass:rgba(255,255,255,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:"Space Grotesk",system-ui,sans-serif;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.neb{position:fixed;z-index:0;border-radius:50%;filter:blur(70px);pointer-events:none;opacity:.5}
.n1{width:60vw;height:60vw;left:-15vw;top:-10vw;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 65%);animation:d1 38s ease-in-out infinite alternate}
.n2{width:55vw;height:55vw;right:-15vw;bottom:-12vw;background:radial-gradient(circle,rgba(220,220,220,.14),transparent 65%);animation:d2 46s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(18vw,14vw) scale(1.25)}}
@keyframes d2{to{transform:translate(-16vw,-12vw) scale(1.2)}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:28px 20px 56px}
.logo{display:block;width:100%;height:auto;mix-blend-mode:screen;filter:drop-shadow(0 0 18px rgba(255,255,255,.35));animation:float 7s ease-in-out infinite;-webkit-mask-image:radial-gradient(ellipse at center,#000 60%,transparent 78%);mask-image:radial-gradient(ellipse at center,#000 60%,transparent 78%)}
@keyframes float{50%{transform:translateY(-8px)}}
h1{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:clamp(2.6rem,10vw,4.6rem);letter-spacing:.08em;text-align:center;margin:14px 0 26px;text-shadow:0 0 24px rgba(255,255,255,.45)}
ol{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:r}
li{counter-increment:r;display:flex;gap:16px;align-items:baseline;padding:14px 18px;background:var(--glass);border:1px solid var(--line);border-radius:4px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-weight:500;font-size:1.02rem;letter-spacing:.02em;transition:background .25s,border-color .25s,transform .25s}
li::before{content:counter(r);font-family:"Bebas Neue",Impact,sans-serif;font-size:1.7rem;line-height:1;min-width:1.4ch;color:var(--dim)}
li:hover{background:rgba(255,255,255,.11);border-color:var(--fg);transform:translateX(4px)}
li small{display:block;font-weight:400;color:var(--dim);font-size:.85rem;margin-top:3px;letter-spacing:0}
.tt{display:flex;justify-content:center;margin-top:34px}
.tt a{display:inline-flex;align-items:center;gap:10px;color:#000;background:var(--fg);text-decoration:none;font-weight:700;padding:13px 26px;border-radius:999px;box-shadow:0 0 28px rgba(255,255,255,.35);transition:box-shadow .25s,transform .25s}
.tt a:hover{box-shadow:0 0 44px rgba(255,255,255,.7);transform:scale(1.04)}
.tt a:focus-visible,li:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.tt svg{width:20px;height:20px;fill:#000}
.reveal{animation:in 1.1s ease-out both}
@keyframes in{from{opacity:0;filter:blur(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
var c=document.getElementById('sky'),x=c.getContext('2d'),W,H,D,S=[],sh=[],mx=0,my=0,tx=0,ty=0;

function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);

 x.clearRect(0,0,W,H);mx+=(tx-mx)*.04;my+=(ty-my)*.04;

  x.globalAlpha=1;x.strokeStyle=g;x.lineWidth=1.6;x.beginPath();x.moveTo(m.x,m.y);x.lineTo(m.x+90,m.y-40);x.stroke();
